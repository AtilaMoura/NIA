# CI só de CHECAGEM — não faz deploy em lugar nenhum (o deploy nas VMs continua
# manual: git pull + docker compose up -d --build, ver DEPLOY.md). Objetivo é
# pegar erro de sintaxe/tipo/dependência ANTES de alguém subir pra produção.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instala de verdade (não só sintaxe) pra pegar conflito de versão nas
      # dependências pinadas — já aconteceu antes (fastapi × anyio × google-genai).
      - name: Instala dependências
        run: pip install -r backend/requirements.txt

      # compileall NÃO executa nada (não conecta em banco, não precisa de .env) —
      # só valida que todo arquivo .py compila. app/main.py conecta no Postgres
      # na importação, então rodar de verdade não cabe num CI sem infra.
      - name: Checa sintaxe de todos os arquivos
        run: python -m compileall backend/app -q

  emaus-web:
    name: Emaús (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emaus-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: emaus-web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  frontend-tech:
    # Front "tech" (NIA original) — pausado desde a decisão multi-tenant, mas o
    # código continua no repo. continue-on-error pra não travar o CI por um
    # projeto que ninguém está mantendo ativamente agora.
    name: Front tech (pausado) — TypeScript
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
