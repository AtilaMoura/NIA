<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visualizar protótipo — celular, tablet e desktop</title>
<!--
  Mostra um protótipo em 3 larguras lado a lado, e TODOS os estados/slides dele,
  um embaixo do outro (uma linha por estado).
  Uso: _visualizar.html?p=05-topico.html
       _visualizar.html?p=05-topico.html&estados=capa,conteudo   (escolhe os estados)
  Cada estado vira o # passado pro protótipo (ex.: 05-topico.html#checkpoint).
  Sem ?p= mostra a lista de protótipos.
-->
<style>
  body { margin: 0; background: #2b2b2b; font: 13px system-ui, sans-serif; color: #ddd; }
  header { position: sticky; top: 0; z-index: 5; background: #2b2b2b; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid #444; }
  header a { color: #eab676; text-decoration: none; }
  header a.atual { color: #fff; font-weight: 700; }
  .estado { padding: 14px; border-bottom: 1px solid #3a3a3a; }
  .estado h2 { margin: 0 0 8px; font-size: 14px; color: #fff; }
  .estado h2 small { font-weight: 400; color: #999; margin-left: 6px; }
  .telas { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; }
  figure { margin: 0; flex: none; }
  figcaption { margin-bottom: 4px; opacity: .7; }
  iframe { border: 0; background: #fff; display: block; }
</style>
</head>
<body>
<header id="topo"></header>
<main id="conteudo"></main>
<script>
  // Estados conhecidos de cada protótipo (o que vai depois do # na URL dele)
  const PROTOTIPOS = {
    "01-visitante.html": { nome: "01 · Visitante", estados: [["", "Página"], ["escuro", "Tema escuro"]] },
    "02-entrar-criar-conta.html": { nome: "02 · Entrar / Criar conta", estados: [["", "Entrar"], ["erro", "Entrar com erro"], ["criar", "Criar conta"], ["criar,erro,escuro", "Criar conta · erro · escuro"]] },
    "03-inicio.html": { nome: "03 · Início", estados: [["", "Com curso em andamento"], ["novo", "Aluno novo"], ["escuro", "Tema escuro"]] },
    "04-curso.html": { nome: "04 · Curso", estados: [["", "Em andamento"], ["novo", "0% (começar)"], ["escuro", "Tema escuro"]] },
    "05-topico.html": { nome: "05 · Tópico", estados: [["capa", "Capa"], ["conteudo", "Conteúdo"], ["checkpoint", "Checkpoint"], ["resultado", "Resultado"], ["conteudo,escuro", "Conteúdo · escuro"]] },
    "06-prova.html": { nome: "06 · Prova", estados: [["bloqueio", "Bloqueio (tópico não concluído)"], ["intro", "Introdução"], ["pergunta", "Objetiva respondida"], ["aberta", "Aberta"], ["resultado", "Antes de enviar"], ["corrigindo", "Corrigindo"], ["revisao", "Revisão do tutor"], ["revisao,escuro", "Revisão · escuro"]] },
    "07-progresso.html": { nome: "07 · Progresso", estados: [["", "Com progresso"], ["novo", "Nada começado"], ["escuro", "Tema escuro"]] },
    "08-perfil.html": { nome: "08 · Perfil", estados: [["", "Padrão"], ["editando", "Editando o nome"], ["senha", "Trocando a senha"], ["senha-ok", "Senha alterada"], ["escuro", "Tema escuro"]] },
  };
  const TELAS = [
    { rotulo: "Celular", w: 375, h: 700, zoom: 1 },
    { rotulo: "Tablet", w: 768, h: 700, zoom: 0.75 },
    { rotulo: "Desktop", w: 1280, h: 760, zoom: 0.55 },
  ];

  const params = new URLSearchParams(location.search);
  const p = params.get("p");
  const topo = document.getElementById("topo");
  topo.innerHTML = Object.entries(PROTOTIPOS)
    .map(([arq, info]) => `<a href="?p=${arq}" class="${arq === p ? "atual" : ""}">${info.nome}</a>`)
    .join("");

  if (p) {
    const info = PROTOTIPOS[p] ?? { estados: [["", p]] };
    const pedidos = params.get("estados");
    const estados = pedidos ? pedidos.split(";").map((e) => [e, e || "Padrão"]) : info.estados;
    const main = document.getElementById("conteudo");

    for (const [hash, rotulo] of estados) {
      const sec = document.createElement("section");
      sec.className = "estado";
      sec.innerHTML = `<h2>${rotulo}<small>${p}${hash ? "#" + hash : ""}</small></h2><div class="telas"></div>`;
      const telas = sec.querySelector(".telas");
      for (const t of TELAS) {
        const fig = document.createElement("figure");
        fig.innerHTML = `<figcaption>${t.rotulo} (${t.w}px)</figcaption>`;
        const f = document.createElement("iframe");
        f.loading = "lazy"; // só carrega quando a linha chega perto da tela
        f.src = p + (hash ? "#" + hash : "");
        f.style.width = t.w + "px";
        f.style.height = t.h + "px";
        if (t.zoom !== 1) {
          // encolhido pra caber sem perder o layout daquela largura
          f.style.transform = `scale(${t.zoom})`;
          f.style.transformOrigin = "0 0";
          fig.style.width = t.w * t.zoom + "px";
          fig.style.height = t.h * t.zoom + 20 + "px";
        }
        fig.appendChild(f);
        telas.appendChild(fig);
      }
      main.appendChild(sec);
    }
  }
</script>
</body>
</html>
